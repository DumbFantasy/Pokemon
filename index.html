<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle Simulator - Sprites Animados</title>
    <!-- Tailwind CSS para el diseño de la estructura -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tipografía Retro de Game Boy -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0d0e15;
            color: #ffffff;
            user-select: none;
        }

        /* Rendering Pixel-Perfect para que los sprites no se vean borrosos */
        .pixel-sprite {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        /* Marco de consola retro */
        .gba-box-outer {
            border: 6px solid #1e293b;
            background: #0f172a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
        }

        /* Animación sutil de respiración/flotado para el sprite */
        @keyframes pixel-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-pixel-float { 
            animation: pixel-float 2s steps(4, start) infinite; 
        }

        /* Animación de ataque hacia adelante */
        @keyframes attack-player-slide {
            0% { transform: translate(0, 0); }
            30% { transform: translate(40px, -40px); }
            100% { transform: translate(0, 0); }
        }
        .anim-attack-player { 
            animation: attack-player-slide 0.3s steps(5); 
        }

        /* Animación de ataque del rival */
        @keyframes attack-enemy-slide {
            0% { transform: translate(0, 0); }
            30% { transform: translate(-40px, 40px); }
            100% { transform: translate(0, 0); }
        }
        .anim-attack-enemy { 
            animation: attack-enemy-slide 0.3s steps(5); 
        }

        /* Parpadeo cuando reciben daño */
        @keyframes damage-flash {
            0%, 100% { opacity: 1; filter: none; }
            25%, 75% { opacity: 0.2; filter: brightness(3) drop-shadow(0 0 10px red); }
        }
        .anim-damage { 
            animation: damage-flash 0.35s steps(2); 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL GBA -->
    <div class="w-full max-w-2xl gba-box-outer rounded-xl overflow-hidden relative shadow-2xl">
        
        <!-- PANTALLA DE BATALLA -->
        <div class="relative w-full h-80 bg-gradient-to-b from-indigo-950 via-sky-900 to-emerald-900 overflow-hidden p-4">
            
            <!-- PLATAFORMAS DE COMBATE -->
            <div class="absolute top-24 right-6 w-48 h-10 bg-emerald-700/80 rounded-full border-b-4 border-emerald-950"></div>
            <div class="absolute bottom-6 left-6 w-56 h-12 bg-emerald-600/80 rounded-full border-b-4 border-emerald-950"></div>

            <!-- SPRITE ANIMADO DEL RIVAL (CHARIZARD) -->
            <div id="enemy-sprite-box" class="absolute top-6 right-12 z-10 animate-pixel-float">
                <img id="enemy-sprite" 
                     src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif" 
                     alt="Charizard" 
                     class="w-36 h-36 object-contain pixel-sprite drop-shadow-[0_8px_0_rgba(0,0,0,0.4)]">
            </div>

            <!-- SPRITE ANIMADO DEL JUGADOR (PIKACHU ESPALDA) -->
            <div id="player-sprite-box" class="absolute bottom-0 left-10 z-10 animate-pixel-float">
                <img id="player-sprite" 
                     src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/back/25.gif" 
                     alt="Pikachu Back" 
                     class="w-32 h-32 object-contain pixel-sprite drop-shadow-[0_8px_0_rgba(0,0,0,0.4)]">
            </div>

        </div>

        <!-- BOTONES DE PRUEBA DE ANIMACIONES -->
        <div class="bg-slate-900 border-t-4 border-slate-700 p-4 flex gap-3 justify-center">
            <button onclick="testAttack('player')" class="px-3 py-2 bg-red-600 hover:bg-red-500 text-[10px] font-bold rounded">
                ⚡ Atacar con Pikachu
            </button>
            <button onclick="testAttack('enemy')" class="px-3 py-2 bg-orange-600 hover:bg-orange-500 text-[10px] font-bold rounded">
                🔥 Atacar con Charizard
            </button>
        </div>

    </div>

    <script>
        // Funciones para probar las animaciones con CSS
        function testAttack(who) {
            if (who === 'player') {
                const pSprite = document.getElementById('player-sprite');
                const eSprite = document.getElementById('enemy-sprite');

                // Pikachu ataca
                pSprite.classList.add('anim-attack-player');
                setTimeout(() => {
                    pSprite.classList.remove('anim-attack-player');
                    // Charizard recibe el golpe
                    eSprite.classList.add('anim-damage');
                    setTimeout(() => eSprite.classList.remove('anim-damage'), 350);
                }, 250);

            } else {
                const pSprite = document.getElementById('player-sprite');
                const eSprite = document.getElementById('enemy-sprite');

                // Charizard ataca
                eSprite.classList.add('anim-attack-enemy');
                setTimeout(() => {
                    eSprite.classList.remove('anim-attack-enemy');
                    // Pikachu recibe el golpe
                    pSprite.classList.add('anim-damage');
                    setTimeout(() => pSprite.classList.remove('anim-damage'), 350);
                }, 250);
            }
        }
    </script>
</body>
</html>
