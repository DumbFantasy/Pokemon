<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle Simulator - Kanto Legends Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0d0e15;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
        }

        .vt323 {
            font-family: 'VT323', monospace;
        }

        .gba-box {
            background: #282c3c;
            border: 4px solid #e2e8f0;
            box-shadow: 
                inset -4px -4px 0px 0px #12151e,
                inset 4px 4px 0px 0px #475569,
                0px 6px 0px 0px #000000;
            border-radius: 4px;
        }

        .gba-box-outer {
            border: 6px solid #1e293b;
            background: #0f172a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
        }

        .gba-status-card {
            background: #f8fafc;
            color: #0f172a;
            border: 3px solid #1e293b;
            box-shadow: 3px 3px 0px #000000;
            border-radius: 4px;
        }

        .scanlines {
            position: relative;
            overflow: hidden;
        }
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 20;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .pixel-hp-container {
            background-color: #334155;
            border: 2px solid #0f172a;
            padding: 1px;
            border-radius: 2px;
        }

        .hp-bar-fill {
            transition: width 0.4s steps(10, end), background-color 0.4s ease;
        }

        .pixel-sprite {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        @keyframes pixel-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-pixel-float { animation: pixel-float 2s steps(4, start) infinite; }

        @keyframes attack-player-slide {
            0% { transform: translate(0, 0); }
            30% { transform: translate(40px, -40px); }
            100% { transform: translate(0, 0); }
        }
        .anim-attack-player { animation: attack-player-slide 0.3s steps(5); }

        @keyframes attack-enemy-slide {
            0% { transform: translate(0, 0); }
            30% { transform: translate(-40px, 40px); }
            100% { transform: translate(0, 0); }
        }
        .anim-attack-enemy { animation: attack-enemy-slide 0.3s steps(5); }

        @keyframes damage-flash {
            0%, 100% { opacity: 1; filter: none; }
            25%, 75% { opacity: 0.2; filter: brightness(3) drop-shadow(0 0 10px red); }
        }
        .anim-damage { animation: damage-flash 0.35s steps(2); }

        @keyframes pop-damage {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
        }
        .damage-pop-text { animation: pop-damage 0.8s ease-out forwards; }

        @keyframes slide-left-panel {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }
        @keyframes slide-right-panel {
            0% { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        @keyframes vs-zoom {
            0% { transform: scale(3); opacity: 0; }
            60% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pokeball-throw {
            0% { transform: translate(-120px, 60px) scale(0.2) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(0, 0) scale(1.2) rotate(720deg); opacity: 1; }
        }

        .anim-vs-left { animation: slide-left-panel 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        .anim-vs-right { animation: slide-right-panel 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        .anim-vs-logo { animation: vs-zoom 0.4s cubic-bezier(0.1, 1.5, 0.3, 1) forwards; }
        .anim-pokeball { animation: pokeball-throw 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- CONTENEDOR PRINCIPAL GBA STYLE -->
    <div class="w-full max-w-2xl gba-box-outer rounded-xl overflow-hidden relative shadow-2xl">
        
        <!-- BARRA SUPERIOR DE AUDIO Y CONTROL -->
        <div class="bg-slate-900 border-b-4 border-slate-800 px-3 py-2 flex items-center justify-between text-[10px]">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-amber-400 font-bold tracking-wider">POKÉMON BATTLE SIMULATOR</span>
            </div>
            <button id="bgm-toggle" onclick="toggleMusic()" class="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded border-2 border-amber-300 transition-all active:translate-y-0.5">
                🎵 MÚSICA: OFF
            </button>
        </div>

        <!-- PANTALLA PRINCIPAL / ARENA DE BATALLA -->
        <div id="battle-screen" class="hidden relative w-full h-72 sm:h-80 scanlines bg-gradient-to-b from-indigo-950 via-sky-900 to-emerald-900 overflow-hidden p-4">
            
            <div class="absolute top-24 right-6 w-48 h-10 bg-emerald-700/80 rounded-full border-b-4 border-emerald-950 shadow-inner"></div>
            <div class="absolute bottom-6 left-6 w-56 h-12 bg-emerald-600/80 rounded-full border-b-4 border-emerald-950 shadow-inner"></div>

            <!-- CARD ESTADO RIVAL -->
            <div id="enemy-card" class="absolute top-3 left-4 w-52 sm:w-64 gba-status-card p-2 z-10 opacity-0 transition-opacity duration-300">
                <div class="flex justify-between items-center text-[10px] font-bold mb-1">
                    <span id="enemy-name">CHARIZARD</span>
                    <span id="enemy-level" class="text-slate-600">Nv50</span>
                </div>
                <div class="flex items-center space-x-1">
                    <span class="text-[8px] font-black text-amber-600">PS</span>
                    <div class="w-full pixel-hp-container">
                        <div id="enemy-hp-bar" class="hp-bar-fill bg-emerald-500 h-2.5 w-full"></div>
                    </div>
                </div>
                <div class="text-[9px] text-right font-bold mt-1 text-slate-700">
                    <span id="enemy-hp-text">150/150</span>
                </div>
            </div>

            <!-- SPRITE RIVAL POKÉMON -->
            <div id="enemy-sprite-box" class="absolute top-4 right-8 z-10 animate-pixel-float flex flex-col items-center opacity-0 transition-opacity duration-500">
                <img id="enemy-sprite" src="" alt="Enemy" class="w-36 h-36 sm:w-44 sm:h-44 object-contain pixel-sprite drop-shadow-[0_8px_0_rgba(0,0,0,0.4)]">
            </div>
            <div id="enemy-damage-pop" class="absolute top-16 right-20 text-yellow-300 font-black text-xl z-30 opacity-0 pointer-events-none"></div>

            <!-- SPRITE JUGADOR POKÉMON -->
            <div id="player-sprite-box" class="absolute bottom-0 left-8 z-10 animate-pixel-float flex flex-col items-center opacity-0 transition-opacity duration-500">
                <img id="player-sprite" src="" alt="Player Back" class="w-36 h-36 sm:w-44 sm:h-44 object-contain pixel-sprite drop-shadow-[0_8px_0_rgba(0,0,0,0.4)]">
            </div>
            <div id="player-damage-pop" class="absolute bottom-20 left-20 text-red-400 font-black text-xl z-30 opacity-0 pointer-events-none"></div>

            <!-- EFECTO DE LANZAMIENTO DE POKÉBALL -->
            <div id="throw-pokeball-enemy" class="absolute top-20 right-36 z-20 opacity-0 text-3xl">🔴</div>
            <div id="throw-pokeball-player" class="absolute bottom-20 left-36 z-20 opacity-0 text-3xl">🔴</div>

            <!-- CARD ESTADO JUGADOR -->
            <div id="player-card" class="absolute bottom-4 right-4 w-56 sm:w-68 gba-status-card p-2 z-10 opacity-0 transition-opacity duration-300">
                <div class="flex justify-between items-center text-[10px] font-bold mb-1">
                    <span id="player-name">PIKACHU</span>
                    <span id="player-level" class="text-slate-600">Nv50</span>
                </div>
                <div class="flex items-center space-x-1 mb-1">
                    <span class="text-[8px] font-black text-amber-600">PS</span>
                    <div class="w-full pixel-hp-container">
                        <div id="player-hp-bar" class="hp-bar-fill bg-emerald-500 h-2.5 w-full"></div>
                    </div>
                </div>
                <div class="flex justify-between items-center text-[8px] font-bold text-slate-700">
                    <span class="text-sky-600">EXP</span>
                    <span><span id="player-hp-text">150/150</span></span>
                </div>
                <div class="w-full bg-slate-300 h-1 mt-0.5 rounded-sm overflow-hidden border border-slate-400">
                    <div class="bg-sky-500 h-full w-3/4"></div>
                </div>
            </div>

            <!-- OVERLAY DE PANTALLA VS -->
            <div id="vs-intro-overlay" class="absolute inset-0 z-30 pointer-events-none hidden overflow-hidden flex items-center justify-center">
                <div id="vs-panel-top" class="absolute top-0 left-0 w-full h-1/2 bg-red-600 border-b-4 border-amber-300 flex items-center justify-end pr-8 transform -translate-x-full">
                    <div class="flex items-center space-x-4">
                        <span id="vs-rival-name" class="text-white text-sm sm:text-lg font-black tracking-widest drop-shadow-md">LÍDER RIVAL</span>
                        <div class="w-24 h-24 sm:w-28 sm:h-28 bg-slate-900 border-4 border-white rounded-lg overflow-hidden flex items-center justify-center shadow-2xl">
                            <img id="vs-rival-img" src="" alt="Rival" class="w-20 h-20 sm:w-24 sm:h-24 object-contain pixel-sprite scale-125">
                        </div>
                    </div>
                </div>
                <div id="vs-panel-bottom" class="absolute bottom-0 left-0 w-full h-1/2 bg-sky-600 border-t-4 border-amber-300 flex items-center justify-start pl-8 transform translate-x-full">
                    <div class="flex items-center space-x-4">
                        <div class="w-24 h-24 sm:w-28 sm:h-28 bg-slate-900 border-4 border-white rounded-lg overflow-hidden flex items-center justify-center shadow-2xl">
                            <img id="vs-player-img" src="" alt="Player" class="w-20 h-20 sm:w-24 sm:h-24 object-contain pixel-sprite scale-125">
                        </div>
                        <span id="vs-player-name" class="text-white text-sm sm:text-lg font-black tracking-widest drop-shadow-md">ENTRENADOR</span>
                    </div>
                </div>
                <div id="vs-logo" class="absolute z-40 opacity-0 transform scale-3xl">
                    <div class="px-6 py-3 bg-amber-400 border-4 border-black text-slate-950 text-2xl sm:text-4xl font-black rounded-2xl shadow-[0_6px_0_rgba(0,0,0,1)] tracking-widest rotate-[-6deg] animate-pulse">
                        VS
                    </div>
                </div>
            </div>

        </div>

        <!-- PANTALLA DE SELECCIÓN DE AVATAR, DIFICULTAD Y POKÉMON -->
        <div id="selection-screen" class="relative w-full h-72 sm:h-80 scanlines bg-gradient-to-b from-slate-900 via-slate-800 to-slate-950 p-3 flex flex-col justify-start items-center overflow-y-auto">
            
            <!-- SELECTOR DE AVATAR -->
            <h2 class="text-[8px] text-amber-400 font-bold mb-1 tracking-widest text-center">ELIGIENDO AVATAR DE ENTRENADOR</h2>
            <div id="avatar-roster" class="flex gap-2 mb-2">
                <!-- Se llena por JavaScript -->
            </div>

            <!-- SELECTOR DE DIFICULTAD -->
            <h2 class="text-[8px] text-amber-400 font-bold mb-1 tracking-widest text-center">DIFICULTAD RIVAL</h2>
            <div class="flex flex-wrap justify-center gap-1.5 mb-2">
                <button onclick="setDifficulty('easy')" id="btn-diff-easy" class="px-2 py-1 bg-emerald-600 border-2 border-emerald-300 text-white text-[7px] font-bold rounded shadow active:translate-y-0.5">
                    😊 FÁCIL
                </button>
                <button onclick="setDifficulty('medium')" id="btn-diff-medium" class="px-2 py-1 bg-amber-600 border-2 border-amber-300 text-white text-[7px] font-bold rounded shadow active:translate-y-0.5 opacity-60">
                    🚀 INTERMEDIO
                </button>
                <button onclick="setDifficulty('hard')" id="btn-diff-hard" class="px-2 py-1 bg-red-600 border-2 border-red-300 text-white text-[7px] font-bold rounded shadow active:translate-y-0.5 opacity-60">
                    👑 DIFÍCIL
                </button>
                <button onclick="setDifficulty('boss')" id="btn-diff-boss" class="px-2 py-1 bg-purple-700 border-2 border-purple-300 text-yellow-300 text-[7px] font-bold rounded shadow active:translate-y-0.5 opacity-60 animate-pulse">
                    🔮 IMPOSIBLE (Mewtwo)
                </button>
            </div>

            <!-- SELECTOR DE POKÉMON -->
            <h2 class="text-[8px] text-amber-400 font-bold mb-1 tracking-widest text-center">ELIGE TU POKÉMON</h2>
            <div id="pokemon-roster" class="grid grid-cols-4 sm:grid-cols-8 gap-1.5 w-full max-w-lg">
                <!-- Se llena por JavaScript -->
            </div>
        </div>

        <!-- SECCIÓN INFERIOR: DIÁLOGOS Y MENÚS -->
        <div class="bg-slate-900 border-t-4 border-slate-700 p-2 sm:p-3 min-h-[150px] flex flex-col justify-between">
            
            <div id="dialog-box" class="gba-box p-3 text-[10px] sm:text-xs text-slate-100 min-h-[56px] flex items-center leading-relaxed tracking-wider vt323 text-lg">
                <span id="typewriter-text">¡Elige tu avatar, dificultad y tu Pokémon!</span>
            </div>

            <!-- MENÚ PRINCIPAL DE BATALLA -->
            <div id="main-menu" class="hidden grid-cols-2 gap-2 mt-2">
                <button onclick="openMoveMenu()" class="py-2.5 bg-red-600 hover:bg-red-500 border-2 border-red-300 text-white font-bold text-[10px] rounded shadow-md active:translate-y-0.5">
                    ⚔️ LUCHAR
                </button>
                <button onclick="openBagMenu()" class="py-2.5 bg-amber-600 hover:bg-amber-500 border-2 border-amber-300 text-white font-bold text-[10px] rounded shadow-md active:translate-y-0.5">
                    🎒 MOCHILA
                </button>
                <button onclick="returnToSelection()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 border-2 border-emerald-300 text-white font-bold text-[10px] rounded shadow-md active:translate-y-0.5">
                    👥 CAMBIAR POKÉMON
                </button>
                <button onclick="handleRun()" class="py-2.5 bg-slate-700 hover:bg-slate-600 border-2 border-slate-400 text-white font-bold text-[10px] rounded shadow-md active:translate-y-0.5">
                    🏃 HUIR
                </button>
            </div>

            <!-- SUB-MENÚ DE MOVIMIENTOS -->
            <div id="moves-menu" class="hidden grid-cols-2 gap-2 mt-2">
                <button onclick="useMove(0)" class="p-2 bg-slate-800 border-2 rounded text-left text-[9px] active:translate-y-0.5 flex flex-col justify-between">
                    <span id="move-name-0" class="font-bold">MOV 1</span>
                    <span class="text-[8px] opacity-90">PP <span id="pp-0">15/15</span></span>
                </button>
                <button onclick="useMove(1)" class="p-2 bg-slate-800 border-2 rounded text-left text-[9px] active:translate-y-0.5 flex flex-col justify-between">
                    <span id="move-name-1" class="font-bold">MOV 2</span>
                    <span class="text-[8px] opacity-90">PP <span id="pp-1">15/15</span></span>
                </button>
                <button onclick="useMove(2)" class="p-2 bg-slate-800 border-2 rounded text-left text-[9px] active:translate-y-0.5 flex flex-col justify-between">
                    <span id="move-name-2" class="font-bold">MOV 3</span>
                    <span class="text-[8px] opacity-90">PP <span id="pp-2">15/15</span></span>
                </button>
                <button onclick="useMove(3)" class="p-2 bg-slate-800 border-2 rounded text-left text-[9px] active:translate-y-0.5 flex flex-col justify-between">
                    <span id="move-name-3" class="font-bold">MOV 4</span>
                    <span class="text-[8px] opacity-90">PP <span id="pp-3">15/15</span></span>
                </button>
                <button onclick="backToMain()" class="col-span-2 py-1.5 bg-slate-800 border-2 border-slate-600 text-red-400 text-[9px] font-bold rounded">
                    ↩️ VOLVER
                </button>
            </div>

            <!-- SUB-MENÚ MOCHILA -->
            <div id="bag-menu" class="hidden flex-col gap-2 mt-2">
                <div class="flex gap-2">
                    <button onclick="usePotionItem()" class="flex-grow p-2 bg-slate-800 border-2 border-amber-400 text-amber-300 text-[9px] rounded text-left flex justify-between items-center">
                        <span>🧪 HIPERPOCIÓN</span>
                        <span>x<span id="potion-count">3</span></span>
                    </button>
                    <button onclick="backToMain()" class="px-3 py-2 bg-slate-800 border-2 border-slate-600 text-red-400 text-[9px] font-bold rounded">
                        VOLVER
                    </button>
                </div>
            </div>

            <!-- MENÚ INICIAL VACÍO -->
            <div id="empty-menu" class="flex justify-center items-center mt-2">
                <span class="text-[9px] text-amber-300 animate-pulse">¡Selecciona un Pokémon arriba para comenzar!</span>
            </div>

        </div>

    </div>

    <!-- SCRIPT PRINCIPAL Y DE AUDIO -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;
        let currentStep = 0;
        let isPlaying = false;
        let currentTrack = 'menu';
        let currentDifficulty = 'easy';

        const AVATARS = [
            { id: 'ethan', name: 'Ethan', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/ethan.png' },
            { id: 'red', name: 'Rojo', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/red.png' },
            { id: 'brendan', name: 'Bruno', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/brendan.png' },
            { id: 'lyra', name: 'Lira', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/lyra.png' },
            { id: 'leaf', name: 'Hoja', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/leaf.png' },
            { id: 'may', name: 'Aura', sprite: 'https://play.pokemonshowdown.com/sprites/trainers/may.png' }
        ];

        let selectedAvatar = AVATARS[0];

        const TRAINERS = {
            easy: { name: "CHICO RUTA 1", sprite: "https://play.pokemonshowdown.com/sprites/trainers/youngster.png" },
            medium: { name: "RECLUTA ROCKET", sprite: "https://play.pokemonshowdown.com/sprites/trainers/teamrocket-gruntf.png" },
            hard: { name: "CAMPEONA CYNTHIA", sprite: "https://play.pokemonshowdown.com/sprites/trainers/cynthia.png" },
            boss: { name: "JEFE GIOVANNI", sprite: "https://play.pokemonshowdown.com/sprites/trainers/giovanni.png" }
        };

        function setDifficulty(diff) {
            playRetroSFX('click');
            currentDifficulty = diff;
            document.getElementById('btn-diff-easy').style.opacity = (diff === 'easy') ? '1' : '0.6';
            document.getElementById('btn-diff-medium').style.opacity = (diff === 'medium') ? '1' : '0.6';
            document.getElementById('btn-diff-hard').style.opacity = (diff === 'hard') ? '1' : '0.6';
            document.getElementById('btn-diff-boss').style.opacity = (diff === 'boss') ? '1' : '0.6';
        }

        function selectAvatar(id) {
            playRetroSFX('click');
            selectedAvatar = AVATARS.find(a => a.id === id);
            renderAvatarSelection();
        }

        function renderAvatarSelection() {
            const container = document.getElementById('avatar-roster');
            container.innerHTML = '';
            AVATARS.forEach(a => {
                const isSelected = (selectedAvatar.id === a.id);
                container.innerHTML += `
                    <button onclick="selectAvatar('${a.id}')" class="gba-box p-1 flex flex-col items-center transition-all ${isSelected ? 'border-amber-400 bg-slate-700 scale-105' : 'opacity-70 hover:opacity-100'}">
                        <img src="${a.sprite}" alt="${a.name}" class="w-8 h-8 object-contain pixel-sprite">
                        <span class="text-[6px] font-bold text-amber-200 mt-0.5">${a.name}</span>
                    </button>
                `;
            });
        }

        const TYPE_CHART = {
            electric: { water: 2.0, grass: 0.5, electric: 0.5, flying: 2.0 },
            fire:     { grass: 2.0, fire: 0.5, water: 0.5, ice: 2.0 },
            water:    { fire: 2.0, water: 0.5, grass: 0.5, ground: 2.0, rock: 2.0 },
            grass:    { water: 2.0, fire: 0.5, grass: 0.5, ground: 2.0, rock: 2.0 },
            ghost:    { ghost: 2.0, psychic: 2.0, normal: 0.0 },
            fairy:    { fighting: 2.0, dragon: 2.0, fire: 0.5, poison: 0.5 },
            normal:   { ghost: 0.0 },
            fighting: { normal: 2.0, psychic: 0.5, ghost: 0.0, rock: 2.0, ice: 2.0 },
            psychic:  { fighting: 2.0, psychic: 0.5, poison: 2.0 },
            ice:      { grass: 2.0, water: 0.5, fire: 0.5, dragon: 2.0, flying: 2.0, ground: 2.0 },
            poison:   { grass: 2.0, poison: 0.5, ground: 0.5, rock: 0.5 },
            ground:   { fire: 2.0, electric: 2.0, poison: 2.0, rock: 2.0, grass: 0.5, flying: 0.0 },
            rock:     { fire: 2.0, ice: 2.0, flying: 2.0, fighting: 0.5, ground: 0.5 },
            flying:   { grass: 2.0, fighting: 2.0, electric: 0.5, rock: 0.5 },
            dragon:   { dragon: 2.0 }
        };

        function getEffectiveness(moveType, targetType) {
            if (TYPE_CHART[moveType] && TYPE_CHART[moveType][targetType] !== undefined) {
                return TYPE_CHART[moveType][targetType];
            }
            return 1.0;
        }

        const F = {
            D4: 293.66, DSharp4: 311.13, E4: 329.63, F4: 349.23, FSharp4: 369.99,
            G4: 392.00, A4: 440.00, ASharp4: 466.16, B4: 493.88, C5: 523.25,
            D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
        };

        const MENU_NOTES = [
            { note: F.E4, mult: 1 }, { note: F.G4, mult: 1 }, { note: F.A4, mult: 2 }, 
            { note: F.B4, mult: 1 }, { note: F.A4, mult: 1 }, { note: F.G4, mult: 1 }, { note: F.E4, mult: 1 },
            { note: F.G4, mult: 1 }, { note: F.A4, mult: 1 }, { note: F.B4, mult: 2 },

        function playNoteStep() {
            if (!isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            let playlist = MENU_NOTES;
            if (currentTrack === 'battle') playlist = BATTLE_NOTES;
            if (currentTrack === 'victory') playlist = VICTORY_NOTES;

            const item = playlist[currentStep % playlist.length];
            const now = audioCtx.currentTime;
            
            const baseTime = (currentTrack === 'battle') ? (60 / 170 / 2) : (currentTrack === 'victory' ? (60 / 145 / 2) : (60 / 133 / 2));
            const duration = baseTime * item.mult;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = (currentTrack === 'battle') ? 'sawtooth' : 'square';
            osc.frequency.setValueAtTime(item.note, now);

            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (duration * 0.95));

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);

            currentStep++;
        }

        function getIntervalByTrack() {
            if (currentTrack === 'battle') return (60000 / 170 / 2); 
            if (currentTrack === 'victory') return (60000 / 145 / 2);
            return (60000 / 133 / 2);
        }

        function toggleMusic() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const btn = document.getElementById('bgm-toggle');

            if (isPlaying) {
                isPlaying = false;
                clearInterval(bgmInterval);
                if (btn) {
                    btn.innerText = "🎵 MÚSICA: OFF";
                    btn.className = "px-2.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded border-2 border-amber-300 transition-all active:translate-y-0.5";
                }
            } else {
                isPlaying = true;
                currentStep = 0;
                bgmInterval = setInterval(playNoteStep, getIntervalByTrack());
                if (btn) {
                    btn.innerText = "⏸️ MÚSICA: ON";
                    btn.className = "px-2.5 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded border-2 border-emerald-300 transition-all active:translate-y-0.5";
                }
            }
        }

        function setTrackMode(mode) {
            currentTrack = mode;
            currentStep = 0;
            if (isPlaying) {
                clearInterval(bgmInterval);
                bgmInterval = setInterval(playNoteStep, getIntervalByTrack());
            }
        }

        function playRetroSFX(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'super-effective') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(700, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            }
        }

        async function selectPokemon(index) {
            playRetroSFX('click');
            setTrackMode('battle');

            const chosen = POKEMON_LIST[index];
            gameState.player = JSON.parse(JSON.stringify(chosen));
            
            if (currentDifficulty === 'boss') {
                gameState.enemy = JSON.parse(JSON.stringify(MEWTWO_POKEMON));
            } else {
                let enemyIndex;
                do {
                    enemyIndex = Math.floor(Math.random() * POKEMON_LIST.length);
                } while (POKEMON_LIST.length > 1 && POKEMON_LIST[enemyIndex].name === chosen.name);
                gameState.enemy = JSON.parse(JSON.stringify(POKEMON_LIST[enemyIndex]));
            }

            const trainerData = TRAINERS[currentDifficulty];
            document.getElementById('vs-rival-name').innerText = trainerData.name;
            document.getElementById('vs-rival-img').src = trainerData.sprite;

            document.getElementById('vs-player-name').innerText = selectedAvatar.name.toUpperCase();
            document.getElementById('vs-player-img').src = selectedAvatar.sprite;

            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            document.getElementById('empty-menu').classList.add('hidden');
            
            document.getElementById('player-sprite').src = gameState.player.spriteBack;
            document.getElementById('enemy-sprite').src = gameState.enemy.spriteFront;
            
            document.getElementById('player-name').innerText = gameState.player.name;
            document.getElementById('enemy-name').innerText = gameState.enemy.name;

            gameState.player.potions = 3;
            updateUI();

            gameState.isBusy = true;
            const overlay = document.getElementById('vs-intro-overlay');
            const topPanel = document.getElementById('vs-panel-top');
            const bottomPanel = document.getElementById('vs-panel-bottom');
            const vsLogo = document.getElementById('vs-logo');

            overlay.classList.remove('hidden');
            topPanel.classList.add('anim-vs-left');
            bottomPanel.classList.add('anim-vs-right');
            vsLogo.classList.add('anim-vs-logo');

            await typeWriter(`¡${trainerData.name} te desafía a un combate!`);
            playRetroSFX('super-effective');
            await new Promise(r => setTimeout(r, 1600));

            topPanel.classList.remove('anim-vs-left');
            bottomPanel.classList.remove('anim-vs-right');
            vsLogo.classList.remove('anim-vs-logo');
            overlay.classList.add('hidden');

            const ballEnemy = document.getElementById('throw-pokeball-enemy');

            await new Promise(r => setTimeout(r, 350));
            ballEnemy.classList.remove('anim-pokeball');

            await typeWriter(`¡El rival envió a ${gameState.enemy.name}!`);
            document.getElementById('enemy-sprite-box').style.opacity = '1';
            document.getElementById('enemy-card').style.opacity = '1';
            playRetroSFX('hit');
            await new Promise(r => setTimeout(r, 700));

            const ballPlayer = document.getElementById('throw-pokeball-player');
            ballPlayer.classList.add('anim-pokeball');
            await new Promise(r => setTimeout(r, 350));
            ballPlayer.classList.remove('anim-pokeball');

            await typeWriter(`¡Adelante, ${gameState.player.name}!`);
            document.getElementById('player-sprite-box').style.opacity = '1';
            document.getElementById('player-card').style.opacity = '1';
            playRetroSFX('heal');
            await new Promise(r => setTimeout(r, 700));

            gameState.player.moves.forEach((m, idx) => {
                document.getElementById(`move-name-${idx}`).innerText = m.name;
                document.getElementById(`pp-${idx}`).innerText = `${m.pp}/${m.maxPp}`;
            });

            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('main-menu').classList.add('grid');

            await typeWriter(`¿Qué debería hacer ${gameState.player.name}?`);
            gameState.isBusy = false;
        }

        function returnToSelection() {
            if (gameState.isBusy) return;
            playRetroSFX('click');
            setTrackMode('menu');

            document.getElementById('enemy-sprite-box').style.opacity = '0';
            document.getElementById('player-sprite-box').style.opacity = '0';
            document.getElementById('enemy-card').style.opacity = '0';
            document.getElementById('player-card').style.opacity = '0';
            document.getElementById('vs-intro-overlay').classList.add('hidden');

            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('grid');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('empty-menu').classList.remove('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            typeWriter("¡Elige tu avatar, dificultad y tu Pokémon!");
        }

        function typeWriter(text) {
            return new Promise((resolve) => {
                const el = document.getElementById('typewriter-text');
                el.innerText = '';
                let i = 0;
                const timer = setInterval(() => {
                    el.innerText += text.charAt(i);
                    i++;
                    if (i >= text.length) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 20);
            });
        }

        function openMoveMenu() {
            if (gameState.isBusy) return;
            playRetroSFX('click');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('moves-menu').classList.remove('hidden');
            document.getElementById('moves-menu').classList.add('grid');
        }

        function openBagMenu() {
            if (gameState.isBusy) return;
            playRetroSFX('click');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('bag-menu').classList.remove('hidden');
            document.getElementById('bag-menu').classList.add('flex');
        }

        function backToMain() {
            playRetroSFX('click');
            document.getElementById('moves-menu').classList.add('hidden');
            document.getElementById('bag-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function updateHPBarColor(barElement, percentage) {
            if (percentage > 50) {
                barElement.className = "hp-bar-fill bg-emerald-500 h-2.5 w-full";
            } else if (percentage > 20) {
                barElement.className = "hp-bar-fill bg-amber-400 h-2.5 w-full";
            } else {
                barElement.className = "hp-bar-fill bg-red-600 h-2.5 w-full";
            }
        }

        function updateUI() {
            if (!gameState.player || !gameState.enemy) return;

            const pPct = Math.max(0, (gameState.player.hp / 150) * 100);
            const playerBar = document.getElementById('player-hp-bar');
            playerBar.style.width = pPct + '%';
            updateHPBarColor(playerBar, pPct);
            document.getElementById('player-hp-text').innerText = `${gameState.player.hp}/150`;
            
            const ePct = Math.max(0, (gameState.enemy.hp / 150) * 100);
            const enemyBar = document.getElementById('enemy-hp-bar');
            enemyBar.style.width = ePct + '%';
            updateHPBarColor(enemyBar, ePct);
            document.getElementById('enemy-hp-text').innerText = `${gameState.enemy.hp}/150`;

            document.getElementById('potion-count').innerText = gameState.player.potions;

            gameState.player.moves.forEach((m, idx) => {
                document.getElementById(`pp-${idx}`).innerText = `${m.pp}/${m.maxPp}`;
            });
        }

        function popDamageText(target, text) {
            const pop = document.getElementById(target === 'enemy' ? 'enemy-damage-pop' : 'player-damage-pop');
            pop.innerText = text;
            pop.classList.remove('damage-pop-text');
            void pop.offsetWidth;
            pop.classList.add('damage-pop-text');
        }

        function chooseEnemyMove() {
            const moves = gameState.enemy.moves;
            const targetType = gameState.player.type;

            if (currentDifficulty === 'easy') {
                return moves[Math.floor(Math.random() * moves.length)];
            } 
            else if (currentDifficulty === 'medium') {
                const superMoves = moves.filter(m => getEffectiveness(m.type, targetType) > 1.0);
                if (superMoves.length > 0 && Math.random() < 0.7) {
                    return superMoves[Math.floor(Math.random() * superMoves.length)];
                }
                return moves[Math.floor(Math.random() * moves.length)];
            } 
            else {
                let bestMove = moves[0];
                let maxScore = -1;

                moves.forEach(m => {
                    const eff = getEffectiveness(m.type, targetType);
                    if (eff === 0.0) return;
                    const score = m.power * eff;
                    if (score > maxScore) {
                        maxScore = score;
                        bestMove = m;
                    }
                });
                return bestMove;
            }
        }

        async function useMove(index) {
            if (gameState.isBusy) return;
            const move = gameState.player.moves[index];

            if (move.pp <= 0) {
                await typeWriter("¡No quedan PP para este movimiento!");
                return;
            }

            gameState.isBusy = true;
            move.pp--;
            backToMain();

            await typeWriter(`¡${gameState.player.name} usó ${move.name}!`);

            const playerSprite = document.getElementById('player-sprite');
            playerSprite.classList.add('anim-attack-player');
            await new Promise(r => setTimeout(r, 250));
            playerSprite.classList.remove('anim-attack-player');

            if (Math.random() <= move.accuracy) {
                const mult = getEffectiveness(move.type, gameState.enemy.type);
                const rawDmg = move.power + Math.floor(Math.random() * 8);
                const finalDmg = Math.floor(rawDmg * mult);

                if (mult === 0) {
                    await typeWriter(`¡No afecta a ${gameState.enemy.name}! 🚫`);
                } else {
                    gameState.enemy.hp = Math.max(0, gameState.enemy.hp - finalDmg);
                    
                    if (mult > 1.0) playRetroSFX('super-effective');
                    else playRetroSFX('hit');

                    popDamageText('enemy', `-${finalDmg}`);

                    const enemySprite = document.getElementById('enemy-sprite');
                    enemySprite.classList.add('anim-damage');
                    updateUI();
                    await new Promise(r => setTimeout(r, 400));
                    enemySprite.classList.remove('anim-damage');

                    if (mult > 1.0) {
                        await typeWriter("¡Es súper eficaz! 💥");
                    } else if (mult < 1.0) {
                        await typeWriter("No es muy eficaz... 🛡️");
                    }
                }

                if (gameState.enemy.hp <= 0) {
                    await new Promise(r => setTimeout(r, 400));
                    setTrackMode('victory');
                    await typeWriter(`¡El ${gameState.enemy.name} enemigo se debilitó! ¡Ganaste! 🏆`);
                    document.getElementById('enemy-sprite-box').style.opacity = '0';
                    return;
                }
            } else {
                await typeWriter(`¡El ataque de ${gameState.player.name} falló!`);
            }

            await new Promise(r => setTimeout(r, 800));

            const enemyMove = chooseEnemyMove();
            await typeWriter(`¡El ${gameState.enemy.name} enemigo usó ${enemyMove.name}!`);

            const enemySprite = document.getElementById('enemy-sprite');
            enemySprite.classList.add('anim-attack-enemy');
            await new Promise(r => setTimeout(r, 250));
            enemySprite.classList.remove('anim-attack-enemy');

            if (Math.random() <= enemyMove.accuracy) {
                const eMult = getEffectiveness(enemyMove.type, gameState.player.type);
                const eRawDmg = enemyMove.power + Math.floor(Math.random() * 6);
                const enemyDmg = Math.floor(eRawDmg * eMult);

                if (eMult === 0) {
                    await typeWriter(`¡No afecta a ${gameState.player.name}! 🚫`);
                } else {
                    gameState.player.hp = Math.max(0, gameState.player.hp - enemyDmg);
                    
                    if (eMult > 1.0) playRetroSFX('super-effective');
                    else playRetroSFX('hit');

                    popDamageText('player', `-${enemyDmg}`);

                    playerSprite.classList.add('anim-damage');
                    updateUI();
                    await new Promise(r => setTimeout(r, 400));
                    playerSprite.classList.remove('anim-damage');

                    if (eMult > 1.0) {
                        await typeWriter("¡Es súper eficaz contra ti! 💥");
                    } else if (eMult < 1.0) {
                        await typeWriter("No fue muy eficaz... 🛡️");
                    }
                }

                if (gameState.player.hp <= 0) {
                    await new Promise(r => setTimeout(r, 400));
                    setTrackMode('victory');
                    await typeWriter(`¡${gameState.player.name} se debilitó! Has perdido el combate... 💀`);
                    document.getElementById('player-sprite-box').style.opacity = '0';
                    return;
                }
            } else {
                await typeWriter(`¡El ataque de ${gameState.enemy.name} falló!`);
            }

            await new Promise(r => setTimeout(r, 600));
            await typeWriter(`¿Qué debería hacer ${gameState.player.name}?`);
            gameState.isBusy = false;
        }

        async function usePotionItem() {
            if (gameState.isBusy) return;
            if (gameState.player.potions <= 0) {
                await typeWriter("¡No quedan Hiperpociones!");
                return;
            }

            gameState.isBusy = true;
            gameState.player.potions--;
            gameState.player.hp = Math.min(150, gameState.player.hp + 60);

            backToMain();
            playRetroSFX('heal');
            updateUI();
            await typeWriter(`¡Usaste HIPERPOCIÓN! Restauraste PS a ${gameState.player.name}.`);

            await new Promise(r => setTimeout(r, 1000));

            const enemyMove = chooseEnemyMove();
            await typeWriter(`¡El ${gameState.enemy.name} enemigo usó ${enemyMove.name}!`);

            const enemyDmg = enemyMove.power + Math.floor(Math.random() * 6);
            gameState.player.hp = Math.max(0, gameState.player.hp - enemyDmg);
            playRetroSFX('hit');
            popDamageText('player', `-${enemyDmg}`);

            updateUI();
            await new Promise(r => setTimeout(r, 800));
            await typeWriter(`¿Qué debería hacer ${gameState.player.name}?`);
            gameState.isBusy = false;
        }

        async function handleRun() {
            if (gameState.isBusy) return;
            playRetroSFX('click');
            await typeWriter("¡Escapaste sin problemas! 🏃💨");
            gameState.isBusy = true;
        }

        window.onload = function() {
            renderSelectionMenu();
        };
    </script>
</body>
</html>
